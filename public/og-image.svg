<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071226"/>
      <stop offset="60%" stop-color="#0D1B3E"/>
      <stop offset="100%" stop-color="#1A2F5E"/>
    </linearGradient>

    <!-- Orange glow -->
    <radialGradient id="glow-orange" cx="75%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue glow left -->
    <radialGradient id="glow-blue" cx="20%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#4F8ECA" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4F8ECA" stop-opacity="0"/>
    </radialGradient>

    <!-- Logo globe gradient -->
    <radialGradient id="globe-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#5BB8F5"/>
      <stop offset="50%" stop-color="#2B7EC1"/>
      <stop offset="100%" stop-color="#0D4A8A"/>
    </radialGradient>

    <!-- Mascot body gradient -->
    <radialGradient id="mascot-body" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#5BB8F5"/>
      <stop offset="55%" stop-color="#2B7EC1"/>
      <stop offset="100%" stop-color="#0D4A8A"/>
    </radialGradient>

    <!-- Mascot glow -->
    <radialGradient id="mascot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F8ECA" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4F8ECA" stop-opacity="0"/>
    </radialGradient>

    <!-- Orange strip gradient -->
    <linearGradient id="strip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>

    <!-- Cap gradient -->
    <linearGradient id="cap-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2F5E"/>
      <stop offset="100%" stop-color="#0D1B3E"/>
    </linearGradient>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient glows -->
  <rect width="1200" height="630" fill="url(#glow-orange)"/>
  <rect width="1200" height="630" fill="url(#glow-blue)"/>

  <!-- ─── Decorative flight route lines ─── -->
  <!-- Main route arc -->
  <path d="M 60,420 C 250,280 500,180 750,210 C 950,235 1080,150 1200,110"
        stroke="white" stroke-width="1.5" stroke-dasharray="10 8"
        fill="none" opacity="0.12"/>
  <!-- Secondary route -->
  <path d="M 0,200 C 200,195 380,340 620,310 C 860,280 1050,390 1200,360"
        stroke="white" stroke-width="1" stroke-dasharray="7 10"
        fill="none" opacity="0.08"/>
  <!-- Third route -->
  <path d="M 100,540 C 300,500 500,460 700,480 C 900,500 1100,440 1200,420"
        stroke="#F97316" stroke-width="1" stroke-dasharray="6 12"
        fill="none" opacity="0.2"/>

  <!-- Route dots -->
  <circle cx="250" cy="340" r="4" fill="white" opacity="0.2"/>
  <circle cx="560" cy="230" r="5" fill="#F97316" opacity="0.5"/>
  <circle cx="850" cy="190" r="3" fill="white" opacity="0.15"/>
  <circle cx="1050" cy="140" r="4" fill="white" opacity="0.12"/>

  <!-- ─── Airplane silhouette on route ─── -->
  <g transform="translate(745,198) rotate(-12)">
    <path d="M 0,0 L 18,-6 L 22,0 L 18,6 Z" fill="white" opacity="0.6"/>
    <path d="M 6,-4 L 14,-14 L 17,-13 L 11,-4 Z" fill="white" opacity="0.5"/>
    <path d="M 8,4 L 16,14 L 19,13 L 13,4 Z" fill="white" opacity="0.5"/>
    <path d="M 16,-2 L 21,-5 L 22,-3 L 18,0 Z" fill="white" opacity="0.4"/>
  </g>

  <!-- ─── Orange bottom accent strip ─── -->
  <rect x="0" y="606" width="1200" height="8" fill="url(#strip)" rx="0"/>
  <rect x="0" y="600" width="400" height="4" fill="#F97316" opacity="0.4"/>

  <!-- ─── Left accent vertical bar ─── -->
  <rect x="0" y="0" width="6" height="630" fill="#F97316" opacity="0.7"/>

  <!-- ═══════════════════════════════════════
       MASCOT — right side, large
  ════════════════════════════════════════ -->
  <!-- Glow behind mascot -->
  <ellipse cx="930" cy="340" rx="160" ry="180" fill="url(#mascot-glow)"/>

  <!-- Body (big blue sphere) -->
  <circle cx="930" cy="355" r="155" fill="url(#mascot-body)"/>
  <!-- Body shine -->
  <ellipse cx="890" cy="295" rx="55" ry="38" fill="white" opacity="0.12" transform="rotate(-15,890,295)"/>

  <!-- Airplane on body (white silhouette) -->
  <g transform="translate(915,340) rotate(-10)">
    <path d="M -55,0 L 55,0 L 65,10 L 55,20 L -55,20 Z" fill="white" opacity="0.22" rx="10"/>
    <path d="M -60,10 L 60,10 L 70,18 L 60,26 L -60,26 Z" fill="none"/>
    <!-- Actual plane shape -->
    <path d="M -55,8 C -30,-8 30,-8 55,8 L 60,14 C 30,4 -30,4 -55,14 Z" fill="white" opacity="0.3"/>
    <path d="M -55,8 L 55,8 C 65,8 68,14 55,20 L -55,20 C -68,20 -65,8 -55,8 Z" fill="white" opacity="0.25"/>
    <circle cx="0" cy="14" r="6" fill="white" opacity="0.3"/>
    <!-- Wings -->
    <path d="M -10,8 L -35,-18 L -20,-18 L 5,8 Z" fill="white" opacity="0.35"/>
    <path d="M 10,8 L 35,-18 L 20,-18 L -5,8 Z" fill="white" opacity="0.35"/>
    <path d="M -10,20 L -30,38 L -18,38 L 5,20 Z" fill="white" opacity="0.28"/>
    <path d="M 10,20 L 30,38 L 18,38 L -5,20 Z" fill="white" opacity="0.28"/>
  </g>

  <!-- Eyes -->
  <!-- Left eye white -->
  <ellipse cx="895" cy="315" rx="28" ry="30" fill="white"/>
  <!-- Right eye white -->
  <ellipse cx="968" cy="315" rx="28" ry="30" fill="white"/>
  <!-- Left pupil -->
  <circle cx="900" cy="318" r="14" fill="#1A3A6E"/>
  <circle cx="904" cy="315" r="7" fill="#0D1B3E"/>
  <circle cx="897" cy="311" r="3" fill="white"/>
  <!-- Right pupil -->
  <circle cx="973" cy="318" r="14" fill="#1A3A6E"/>
  <circle cx="977" cy="315" r="7" fill="#0D1B3E"/>
  <circle cx="970" cy="311" r="3" fill="white"/>

  <!-- Eyebrows -->
  <path d="M 875,292 Q 898,280 920,290" stroke="#1A2F5E" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 948,290 Q 970,280 990,292" stroke="#1A2F5E" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Mouth / smile -->
  <path d="M 898,365 Q 930,392 963,365" stroke="#1A2F5E" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Mouth open slightly -->
  <ellipse cx="931" cy="375" rx="24" ry="12" fill="#cc2244" opacity="0.7"/>
  <path d="M 907,375 Q 931,390 955,375" fill="#aa1133" opacity="0.5"/>

  <!-- Cap (navy hat) -->
  <ellipse cx="930" cy="205" rx="100" ry="22" fill="url(#cap-grad)"/>
  <rect x="830" y="183" width="200" height="50" rx="15" fill="url(#cap-grad)"/>
  <ellipse cx="930" cy="183" rx="100" ry="28" fill="#0D1B3E"/>
  <!-- Cap brim -->
  <ellipse cx="890" cy="226" rx="88" ry="16" fill="#1A2F5E"/>
  <!-- Cap brim orange edge -->
  <path d="M 802,226 Q 890,246 978,226" stroke="#F97316" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Cap text "RODRIGOTUR" -->
  <text x="930" y="212" font-family="Arial Black, Arial, sans-serif" font-size="19" font-weight="900" fill="white" text-anchor="middle" letter-spacing="1">RODRIGO</text>
  <text x="979" y="212" font-family="Arial Black, Arial, sans-serif" font-size="19" font-weight="900" fill="#F97316" text-anchor="start" letter-spacing="1">TUR</text>

  <!-- Left arm (thumbs up) -->
  <path d="M 790,380 C 770,360 755,340 760,310 C 765,290 775,280 790,285 C 795,270 810,265 820,275 C 820,255 840,250 850,265 C 855,248 872,248 876,265 L 876,315 L 800,340 Z"
        fill="white"/>
  <!-- Thumb -->
  <path d="M 790,285 C 780,275 770,280 768,295 C 766,310 776,320 790,315"
        fill="white"/>
  <!-- Glove lines -->
  <path d="M 810,290 L 810,315" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 822,285 L 820,312" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 835,282 L 833,310" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>
  <path d="M 848,285 L 846,312" stroke="#ddd" stroke-width="2" stroke-linecap="round"/>

  <!-- Right arm (open hand, pointing right) -->
  <path d="M 1070,350 C 1095,340 1110,330 1108,305 C 1106,290 1095,282 1082,288 C 1082,272 1068,265 1058,275 C 1055,260 1040,258 1034,272 C 1028,257 1012,260 1010,275 L 1008,325 L 1080,348 Z"
        fill="white"/>
  <!-- Fingers -->
  <path d="M 1108,305 C 1118,295 1120,282 1112,276 C 1104,270 1095,278 1095,290"
        fill="white"/>

  <!-- Legs -->
  <rect x="885" y="500" width="32" height="65" rx="14" fill="#1A3A6E"/>
  <rect x="950" y="500" width="32" height="65" rx="14" fill="#1A3A6E"/>

  <!-- Sneakers left -->
  <ellipse cx="901" cy="568" rx="38" ry="16" fill="#1A3A6E"/>
  <ellipse cx="901" cy="560" rx="36" ry="14" fill="#2B5EA0"/>
  <rect x="864" y="550" width="74" height="18" rx="9" fill="#2B5EA0"/>
  <!-- Laces -->
  <path d="M 872,555 L 888,561 M 888,555 L 872,561 M 900,555 L 916,561 M 916,555 L 900,561 M 920,556 L 930,560" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sole -->
  <rect x="862" y="566" width="78" height="10" rx="5" fill="white"/>

  <!-- Sneakers right -->
  <ellipse cx="966" cy="568" rx="38" ry="16" fill="#1A3A6E"/>
  <ellipse cx="966" cy="560" rx="36" ry="14" fill="#2B5EA0"/>
  <rect x="929" y="550" width="74" height="18" rx="9" fill="#2B5EA0"/>
  <!-- Laces -->
  <path d="M 937,555 L 953,561 M 953,555 L 937,561 M 965,555 L 981,561 M 981,555 L 965,561 M 985,556 L 995,560" stroke="#F97316" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sole -->
  <rect x="927" y="566" width="78" height="10" rx="5" fill="white"/>

  <!-- ═══════════════════════════════════════
       LOGO — left side
  ════════════════════════════════════════ -->
  <!-- Globe circle -->
  <circle cx="190" cy="175" r="95" fill="url(#globe-grad)"/>
  <!-- Globe shine -->
  <ellipse cx="160" cy="140" rx="35" ry="25" fill="white" opacity="0.15" transform="rotate(-20,160,140)"/>
  <!-- Globe ring / swoosh -->
  <ellipse cx="190" cy="185" rx="105" ry="28" fill="none" stroke="white" stroke-width="8" opacity="0.35" transform="rotate(-15,190,185)"/>
  <ellipse cx="190" cy="185" rx="105" ry="28" fill="none" stroke="white" stroke-width="3" opacity="0.15" transform="rotate(-15,190,185)"/>

  <!-- Airplane in logo -->
  <g transform="translate(190,168) rotate(-20)">
    <path d="M -42,0 L 42,0 L 50,8 L 42,16 L -42,16 C -52,16 -50,0 -42,0 Z" fill="white" opacity="0.9"/>
    <path d="M -5,0 L -30,-26 L -18,-26 L 8,0 Z" fill="white" opacity="0.85"/>
    <path d="M 5,0 L 30,-26 L 18,-26 L -8,0 Z" fill="white" opacity="0.85"/>
    <path d="M -5,16 L -22,30 L -14,30 L 6,16 Z" fill="white" opacity="0.75"/>
    <path d="M 5,16 L 22,30 L 14,30 L -6,16 Z" fill="white" opacity="0.75"/>
  </g>

  <!-- Logo border ring -->
  <circle cx="190" cy="175" r="98" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>

  <!-- Logo wordmark -->
  <text x="130" y="310" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="1">RODRIGO</text>
  <text x="130" y="310" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="white" letter-spacing="1">
    <tspan>RODRIGO</tspan>
  </text>
  <!-- Measure "RODRIGO" width ≈ 255px at font-size 52, so "TUR" starts ~385 -->
  <text x="385" y="310" font-family="Arial Black, Arial, sans-serif" font-size="52" font-weight="900" fill="#F97316" letter-spacing="1">TUR</text>
  <!-- Subtitle -->
  <text x="130" y="340" font-family="Arial, sans-serif" font-size="18" fill="white" opacity="0.6" letter-spacing="3">AGÊNCIA DE VIAGENS</text>

  <!-- Divider line -->
  <rect x="130" y="360" width="260" height="2" fill="#F97316" opacity="0.5" rx="1"/>

  <!-- ─── Main tagline ─── -->
  <text x="130" y="430"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34"
        font-weight="700"
        fill="white"
        font-style="italic"
        opacity="0.95">
    "Viaje com confiança,
  </text>
  <text x="130" y="475"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="34"
        font-weight="700"
        fill="#F97316"
        font-style="italic">
    vá de Rodrigo.Tur!"
  </text>

  <!-- Supporting line -->
  <text x="130" y="524"
        font-family="Arial, sans-serif"
        font-size="17"
        fill="white"
        opacity="0.55"
        letter-spacing="0.5">
    Passagens nacionais e internacionais • Atendimento todos os dias
  </text>

  <!-- ─── Contact pill ─── -->
  <rect x="130" y="548" width="300" height="40" rx="20" fill="#F97316"/>
  <text x="280" y="574"
        font-family="Arial Black, Arial, sans-serif"
        font-size="15"
        font-weight="900"
        fill="#0D1B3E"
        text-anchor="middle"
        letter-spacing="0.5">
    rodrigotur.com.br
  </text>

  <!-- WhatsApp text -->
  <text x="450" y="574"
        font-family="Arial, sans-serif"
        font-size="14"
        fill="white"
        opacity="0.55">
    (83) 99368-6142
  </text>

  <!-- ─── Corner decorative circles ─── -->
  <circle cx="1170" cy="30" r="40" fill="none" stroke="#F97316" stroke-width="1.5" opacity="0.2"/>
  <circle cx="1170" cy="30" r="25" fill="none" stroke="#F97316" stroke-width="1" opacity="0.15"/>
  <circle cx="30" cy="600" r="30" fill="none" stroke="white" stroke-width="1" opacity="0.08"/>

  <!-- ─── Cadastur badge ─── -->
  <rect x="1040" y="558" width="136" height="36" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="1108" y="581"
        font-family="Arial, sans-serif"
        font-size="12"
        fill="white"
        opacity="0.55"
        text-anchor="middle"
        letter-spacing="0.5">
    ✓ AGÊNCIA CADASTUR
  </text>
</svg>
